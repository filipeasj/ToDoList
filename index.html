<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lista de tarefas minimalista com para potencializar a organização e produtividade, feito em HTML/CSS/JS."
    />
    <link rel="icon" type="img/png" href="./assets/icon.png">
    <link rel="stylesheet" href="style.css" />
    <title>To Do List</title>
  </head>
  <body>
    <main>
    <div class="container">
      <div class="title">
        <h1>Lista de tarefas</h1>
        <div class="contador">
          <h2 id="numbers">0/0</h2>
        </div>
      </div>
      <div class="row">
        <input
          type="text"
          id="input-box"
          placeholder="Digite uma nova tarefa"
        />
        <button id="add-task">Add</button>
      </div>
      <ul id="list-container"></ul>
    </div>
    <footer class="rodape">
      <p>© 2025 Desenvolvido por Filipe Alves</p>

      <div class="social">
        <a
          href="https://www.linkedin.com/in/filipeasj/"
          target="_blank"
          aria-label="Perfil de Filipe Alves no LinkedIn"
          rel="noopener noreferrer"
        >
          <img
            src="./assets/icon/linkedin-icon.svg"
            alt="LinkedIn"
            width="40"
            height="40"
          />
        </a>

        <a
          href="https://www.instagram.com/filipeasj/"
          target="_blank"
          aria-label="Perfil de Filipe Alves no Instagram"
          rel="noopener noreferrer"
        >
          <img
            src="./assets/icon/instagram-icon.svg"
            alt="Instagram"
            width="40"
            height="40"
          />
        </a>

        <a
          href="https://github.com/filipeasj"
          target="_blank"
          aria-label="Repositórios de Filipe Alves no GitHub"
          rel="noopener noreferrer"
        >
          <img
            src="./assets/icon/github-icon.svg"
            alt="GitHub"
            width="40"
            height="40"
          />
        </a>
      </div>
      </main>
    </footer>
    <script src="script.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"
      defer
    ></script>
  </body>
</html>
